<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/img/favicon1.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Workout</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Muli:300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Oswald:300,400,500,600,700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="/static/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/static/css/flaticon.css" type="text/css">
    <link rel="stylesheet" href="/static/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/static/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/static/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/static/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/static/css/style.css" type="text/css">

    <style>
        /* General Page Setup */
        body {
            background-color: #151515;
            color: #c4c4c4;
            font-family: "Muli", sans-serif;
        }

        .workout {
            padding-top: 50px;
            padding-bottom: 80px;
            max-width: 850px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
            box-sizing: border-box;
        }

        /* Page Heading */
        .workout h1 {
            font-family: "Oswald", sans-serif;
            font-size: 34px;
            font-weight: 700;
            color: #b6ff00;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 30px;
            padding-bottom: 12px;
            border-bottom: 3px solid #b6ff00;
        }

        .workout h1 span {
            color: #ffffff;
        }

        /* Exercise Block */
        .exercise {
            background-color: #0a0a0a;
            border: 1px solid #363636;
            padding: 25px 25px 20px 25px;
            margin-bottom: 30px;
            position: relative;
            transition: border-color 0.3s ease;
        }

        .exercise:hover {
            border-color: #4a4a4a;
        }

        .exercise-title {
            font-family: "Oswald", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #b6ff00;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 4px solid #b6ff00;
        }

        hr {
            border: 0;
            border-top: 1px solid #363636;
            margin-bottom: 25px;
        }

        /* Form Inputs & Selects */
        .exercise-select,
        .set input {
            font-family: "Muli", sans-serif;
            font-size: 14px;
            color: #ffffff;
            background-color: #151515;
            border: 1px solid #363636;
            padding: 12px 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .exercise-select:focus,
        .set input:focus {
            border-color: #b6ff00;
            background-color: #202020;
            color: #ffffff;
        }

        .exercise-select {
            width: 100%;
            margin-bottom: 20px;
            text-transform: capitalize;
            cursor: pointer;
        }

        .exercise-select option {
            background: #151515;
            color: #ffffff;
        }

        /* Sets Container & Row */
        .sets {
            margin-bottom: 20px;
        }

        .set {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 12px;
            background: #121212;
            padding: 12px 16px;
            border: 1px solid #262626;
            transition: border-color 0.25s ease;
        }

        .set:hover {
            border-color: #363636;
        }

        .set strong {
            font-family: "Oswald", sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #ffffff;
            min-width: 70px;
            text-transform: uppercase;
        }

        .set input {
            flex: 1;
            width: 100%;
        }

        /* Buttons Styling */
        button {
            font-family: "Oswald", sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 12px 24px;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .new-set {
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #363636;
            margin-right: 10px;
            margin-bottom: 10px;
        }

        .new-set:hover {
            border-color: #b6ff00;
            color: #b6ff00;
            background-color: #1a1a1a;
        }

        .new-set:active {
            transform: scale(0.98);
        }

        .new-exercise {
            background-color: #252525;
            color: #ffffff;
            border: 1px solid #252525;
            margin-bottom: 10px;
        }

        .new-exercise:hover {
            background-color: #333333;
            border-color: #b6ff00;
            color: #b6ff00;
        }

        .new-exercise:active {
            transform: scale(0.98);
        }

        .save-workout {
            display: block;
            width: 100%;
            background-color: #b6ff00;
            color: #111111;
            padding: 16px 0;
            font-size: 16px;
            margin-top: 20px;
            font-weight: 700;
        }

        .save-workout:hover {
            background-color: #9cdb00;
            color: #000000;
        }

        .save-workout:active {
            transform: scale(0.99);
        }

        .save-workout:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ========================================= */
        /* FULL-SCREEN LOADER OVERLAY */
        /* ========================================= */
        #preloder-overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 999999;
            background: rgba(18, 18, 18, 0.94);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .loader-ring {
            width: 60px;
            height: 60px;
            border: 4px solid #252525;
            border-top: 4px solid #b6ff00;
            border-radius: 50%;
            animation: spinRing 0.85s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(182, 255, 0, 0.25);
        }

        .loader-text {
            font-family: "Oswald", sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .loader-text span {
            color: #b6ff00;
        }

        .loader-bar-wrapper {
            width: 160px;
            height: 3px;
            background: #252525;
            overflow: hidden;
            border-radius: 2px;
        }

        .loader-bar-fill {
            width: 100%;
            height: 100%;
            background: #b6ff00;
            animation: fillBar 1.2s ease-in-out infinite;
            transform-origin: left;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fillBar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(0%); }
            100% { transform: translateX(100%); }
        }

        /* Responsive */
        @media (max-width: 767px) {
            .workout {
                padding-top: 110px;
                padding-left: 15px;
                padding-right: 15px;
            }

            .workout h1 {
                font-size: 26px;
            }

            .set {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .new-set,
            .new-exercise {
                width: 100%;
                margin-right: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Fullscreen Loading Overlay Begin -->
    <div id="preloder-overlay">
        <div class="loader-ring"></div>
        <div class="loader-text">Saving <span>Workout...</span></div>
        <div class="loader-bar-wrapper">
            <div class="loader-bar-fill"></div>
        </div>
    </div>
    <!-- Fullscreen Loading Overlay End -->

    <!-- Workout Form Section Begin -->
    <div class="workout">
        <h1>Hello <span>{{ User.username }},</span><br>Let's Start Today's Workout,<br> <span>{{ Muscle_group }}</span>
        </h1>
        <form method="POST" id="workoutForm">
            {% csrf_token %}
            <!-- ================================= -->
            <!-- ALL EXERCISES GO INSIDE THIS DIV -->
            <!-- ================================= -->
            <div id="exercisesContainer">
                <!-- ================================= -->
                <!-- FIRST EXERCISE -->
                <!-- ================================= -->
                <div class="exercise">
                    <div class="exercise-title">
                        Exercise
                    </div>
                    <!-- Exercise Selection -->
                    <select name="exercise[]" class="exercise-select" required>
                        <option value="" selected disabled>
                            Select Exercise
                        </option>
                        {% for exercise in exercises %}
                        <option value="{{ exercise }}">
                            {{ exercise }}
                        </option>
                        {% endfor %}
                    </select>
                    <!-- Error message -->
                    <div class="error"></div>
                    <!-- ================= -->
                    <!-- SETS -->
                    <!-- ================= -->
                    <div class="sets">
                        <!-- SET 1 -->
                        <div class="set">
                            <strong>
                                Set 1
                            </strong>
                            <input type="tel" name="weight[]" class="weight" placeholder="Enter Weight" min="0"
                                step="any" required>
                            <input type="tel" name="reps[]" class="reps" placeholder="Enter Reps" min="1" step="1"
                                required>
                        </div>
                    </div>
                    <!-- ================= -->
                    <!-- BUTTONS -->
                    <!-- ================= -->
                    <button type="button" class="new-set">
                        New Set
                    </button>
                    <button type="button" class="new-exercise">
                        New Exercise
                    </button>
                </div>
            </div>
            <!-- ================================= -->
            <!-- SAVE WORKOUT -->
            <!-- ================================= -->
            <button type="submit" class="save-workout">
                Save Workout
            </button>
        </form>
    </div>

    <!-- ========================================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================================= -->
    <script>
        const exercisesContainer = document.getElementById("exercisesContainer");
        const workoutForm = document.getElementById("workoutForm");
        const loaderOverlay = document.getElementById("preloder-overlay");
        const saveWorkoutBtn = workoutForm.querySelector(".save-workout");

        const MAX_SETS = 2; // 2 sets limit

        function showLoader() {
            if (loaderOverlay) {
                loaderOverlay.style.display = "flex";
            }
            if (saveWorkoutBtn) {
                saveWorkoutBtn.disabled = true;
                saveWorkoutBtn.innerText = "Saving Workout...";
            }
        }

        function hideLoader() {
            if (loaderOverlay) {
                loaderOverlay.style.display = "none";
            }
            if (saveWorkoutBtn) {
                saveWorkoutBtn.disabled = false;
                saveWorkoutBtn.innerText = "Save Workout";
            }
        }

        // Calculate total available exercises from the initial dropdown options (excluding empty placeholder)
        function getTotalAvailableExercises() {
            const firstSelect = exercisesContainer.querySelector(".exercise-select");
            if (!firstSelect) return 0;
            return Array.from(firstSelect.querySelectorAll("option"))
                .filter(opt => opt.value.trim() !== "").length;
        }

        // Prevent accidental back/forward navigation, refresh, or tab/window close
        let isWorkoutSaved = false;
        let isLeavingWithPermission = false;

        history.pushState({ workoutPage: true }, "", window.location.href);

        function hasUnsavedWorkoutChanges() {
            if (isWorkoutSaved || isLeavingWithPermission) {
                return false;
            }

            const hasInput = Array.from(
                workoutForm.querySelectorAll("input, select, textarea")
            ).some(element => element.value.trim() !== "");

            return hasInput || exercisesContainer.querySelectorAll(".exercise").length > 1;
        }

        function confirmLeave() {
            if (!hasUnsavedWorkoutChanges()) {
                return true;
            }

            return window.confirm(
                "You have unsaved workout data. Are you sure you want to leave this page?"
            );
        }

        window.addEventListener("popstate", function () {
            if (confirmLeave()) {
                isLeavingWithPermission = true;
                history.back();
            } else {
                history.pushState({ workoutPage: true }, "", window.location.href);
            }
        });

        window.addEventListener("beforeunload", function (event) {
            if (hasUnsavedWorkoutChanges()) {
                event.preventDefault();
                event.returnValue = "";
            }
        });

        // Updates dropdowns and hides 'New Exercise' buttons if all items are selected
        function updateExerciseOptions() {
            const selects = document.querySelectorAll(".exercise-select");
            const selectedValues = Array.from(selects)
                .map(s => s.value)
                .filter(val => val !== "");

            selects.forEach(select => {
                const currentVal = select.value;
                const options = select.querySelectorAll("option");

                options.forEach(option => {
                    if (!option.value) return;

                    if (selectedValues.includes(option.value) && option.value !== currentVal) {
                        option.disabled = true;
                    } else {
                        option.disabled = false;
                    }
                });
            });

            const totalExercises = getTotalAvailableExercises();
            const exerciseButtons = document.querySelectorAll(".new-exercise");

            const isMaxReached = selectedValues.length >= totalExercises;
            exerciseButtons.forEach(btn => {
                btn.style.display = isMaxReached ? "none" : "";
            });
        }

        function validateSet(set) {
            const weight = set.querySelector(".weight");
            const reps = set.querySelector(".reps");

            if (weight.value.trim() === "") {
                alert("Please enter weight.");
                weight.focus();
                return false;
            }
            if (reps.value.trim() === "") {
                alert("Please enter reps.");
                reps.focus();
                return false;
            }
            if (Number(weight.value) < 0) {
                alert("Weight cannot be negative.");
                weight.focus();
                return false;
            }
            if (Number(reps.value) <= 0) {
                alert("Reps must be greater than 0.");
                reps.focus();
                return false;
            }
            return true;
        }

        function validateExercise(exercise) {
            const select = exercise.querySelector(".exercise-select");
            if (!select.value) {
                alert("Please select an exercise.");
                select.focus();
                return false;
            }
            const sets = exercise.querySelectorAll(".set");
            if (sets.length === 0) {
                alert("Please add at least one set.");
                return false;
            }
            for (let set of sets) {
                if (!validateSet(set)) {
                    return false;
                }
            }
            return true;
        }

        exercisesContainer.addEventListener("change", function (event) {
            if (event.target.classList.contains("exercise-select")) {
                updateExerciseOptions();
            }
        });

        exercisesContainer.addEventListener("click", function (event) {
            // New Set (Limit to 2)
            if (event.target.classList.contains("new-set")) {
                const exercise = event.target.closest(".exercise");
                const setsContainer = exercise.querySelector(".sets");
                const existingSets = setsContainer.querySelectorAll(".set");

                if (existingSets.length >= MAX_SETS) {
                    alert(`Maximum ${MAX_SETS} sets allowed per exercise.`);
                    return;
                }

                const lastSet = setsContainer.querySelector(".set:last-child");
                if (!validateSet(lastSet)) {
                    return;
                }

                const setNumber = existingSets.length + 1;
                const newSet = document.createElement("div");
                newSet.classList.add("set");
                newSet.innerHTML = `
                    <strong>Set ${setNumber}</strong>
                    <input type="tel" name="weight[]" class="weight" placeholder="Enter Weight" min="0" step="any" required>
                    <input type="tel" name="reps[]" class="reps" placeholder="Enter Reps" min="1" step="1" required>
                `;
                setsContainer.appendChild(newSet);
                newSet.querySelector(".weight").focus();

                if (setNumber >= MAX_SETS) {
                    event.target.style.display = "none";
                }
            }

            // New Exercise
            if (event.target.classList.contains("new-exercise")) {
                const currentExercise = event.target.closest(".exercise");
                if (!validateExercise(currentExercise)) {
                    return;
                }

                const totalExercises = getTotalAvailableExercises();
                const currentExerciseCount = exercisesContainer.querySelectorAll(".exercise").length;
                if (currentExerciseCount >= totalExercises) {
                    alert("All available exercises have already been added.");
                    return;
                }

                const newExercise = document.createElement("div");
                newExercise.classList.add("exercise");
                newExercise.innerHTML = `
                    <div class="exercise-title">Exercise</div>
                    <select name="exercise[]" class="exercise-select" required>
                        <option value="" selected disabled>Select Exercise</option>
                        {% for exercise in exercises %}
                        <option value="{{ exercise }}">{{ exercise }}</option>
                        {% endfor %}
                    </select>
                    <div class="error"></div>
                    <div class="sets">
                        <div class="set">
                            <strong>Set 1</strong>
                            <input type="tel" name="weight[]" class="weight" placeholder="Enter Weight" min="0" step="any" required>
                            <input type="tel" name="reps[]" class="reps" placeholder="Enter Reps" min="1" step="1" required>
                        </div>
                    </div>
                    <button type="button" class="new-set">New Set</button>
                    <button type="button" class="new-exercise">New Exercise</button>
                `;
                exercisesContainer.appendChild(newExercise);

                updateExerciseOptions();

                newExercise.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });
                newExercise.querySelector(".exercise-select").focus();
            }
        });

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                const cookies = document.cookie.split(";");
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === name + "=") {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        workoutForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const exercises = exercisesContainer.querySelectorAll(".exercise");

            // Validate before triggering loader
            for (let exercise of exercises) {
                if (!validateExercise(exercise)) {
                    return;
                }
            }

            // Start loader animation
            showLoader();

            const workoutData = [];

            exercises.forEach(exerciseEl => {
                const exerciseName = exerciseEl.querySelector(".exercise-select").value;
                const setElements = exerciseEl.querySelectorAll(".set");
                const setsData = [];

                setElements.forEach((setEl, index) => {
                    const weight = parseFloat(setEl.querySelector(".weight").value);
                    const reps = parseInt(setEl.querySelector(".reps").value, 10);

                    setsData.push({
                        set_number: index + 1,
                        weight: weight,
                        reps: reps
                    });
                });

                workoutData.push({
                    exercise_name: exerciseName,
                    sets: setsData
                });
            });

            try {
                const response = await fetch("/workout/", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "X-CSRFToken": getCookie("csrftoken")
                    },
                    body: JSON.stringify({ workout: workoutData })
                });

                const result = await response.json();

                if (response.ok && result.status === "success") {
                    isWorkoutSaved = true;
                    isLeavingWithPermission = true;
                    window.location.href = "/404/";
                } else {
                    hideLoader();
                    alert(result.message || "Something went wrong while saving your workout.");
                }
            } catch (error) {
                console.error("Error submitting workout:", error);
                hideLoader();
                alert("Network error. Please check your connection and try again.");
            }
        });

        // Initialize state on page load
        updateExerciseOptions();
    </script>
</body>

</html>
